name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Calculate next version
        id: version
        run: bash .github/scripts/release-version.sh
      - name: Generate release notes
        if: steps.version.outputs.has_release == 'true'
        run: bash .github/scripts/release-notes.sh '${{ steps.version.outputs.previous }}'
      - name: Build release artifacts
        if: steps.version.outputs.has_release == 'true'
        run: bash .github/scripts/stage-release.sh '${{ steps.version.outputs.version }}'
      - name: Publish GitHub release
        if: steps.version.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$VERSION")" = "$GITHUB_SHA"
          else
            git tag -a "$VERSION" -m "$VERSION" "$GITHUB_SHA"
            git push origin "$VERSION"
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md
          else
            gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file RELEASE_NOTES.md
          fi

          gh release upload "$VERSION" --clobber \
            dist/assets/lnproxy-client-"${VERSION}" \
            dist/assets/lnproxy-client-"${VERSION}".exe \
            dist/assets/lnproxy-init-"${VERSION}" \
            dist/assets/lnproxy-init-"${VERSION}".exe \
            dist/assets/lnproxy-node-"${VERSION}" \
            dist/assets/lnproxy-node-"${VERSION}".exe \
            dist/assets/lnproxy-probe-"${VERSION}" \
            dist/assets/lnproxy-probe-"${VERSION}".exe \
            dist/assets/lnproxy-windows-server-"${VERSION}".exe \
            "dist/lnproxy-${VERSION}-amd64.zip" \
            dist/README.md \
            dist/README.zh-CN.md

          while IFS= read -r old_asset; do
            case "$old_asset" in
            "lnproxy-client-v${VERSION}" | "lnproxy-init-v${VERSION}" | \
              "lnproxy-node-v${VERSION}" | "lnproxy-probe-v${VERSION}" | \
              "lnproxy-windows-server-v${VERSION}.exe" | \
              "lnproxy-${VERSION}-amd64.zip" | "README.md" | "README.zh-CN.md")
              ;;
            lnproxy-client | lnproxy-init | lnproxy-node | lnproxy-probe | \
              lnproxy-client.exe | lnproxy-init.exe | lnproxy-node.exe | \
              lnproxy-probe.exe | lnproxy-windows-server.exe | amd64.zip)
              gh release delete-asset "$VERSION" "$old_asset" --yes
              ;;
            esac
          done < <(gh release view "$VERSION" --json assets --jq '.assets[].name')
