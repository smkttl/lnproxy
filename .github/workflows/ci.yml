name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build all packages
        run: go build ./...
      - name: Build release artifacts
        run: bash .github/scripts/stage-release.sh v1.0.0
      - name: Verify release artifacts
        run: bash .github/scripts/verify-release-artifacts.sh
      - name: Smoke test Linux release artifacts
        run: bash .github/scripts/smoke-test-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lnproxy-pr-${{ github.sha }}
          path: dist/
          if-no-files-found: error
